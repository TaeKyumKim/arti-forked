# 작품·안내 구역 (map 프레임, m) — T04. 두 로봇이 같이 쓰는 공용 좌표.
#
# 구역 모양 (shape)
#   semicircle (기본): 중심(x, y)에서 정면 방향(facing_deg, 방 쪽)으로 반지름 radius만큼 펼쳐진 반원.
#                      점 p가 구역 안 = |p - 중심| <= radius 이고, (p - 중심)이 정면 쪽 (벽 뒤쪽 반은 제외)
#   rect             : x_min~x_max, y_min~y_max 직사각형 (map 축에 나란함)
#
# 측정값 (2026-11-17, 벽에 붙은 작품 양 끝을 RViz로 찍음) → 중심은 양 끝의 가운데.
# 반원이 벽에 붙도록: 정면 = 가장 가까운 벽에 수직(0/90/180/-90°), 중심은 벽 방향으로 옮겨
# maps/gallery.pgm의 벽면(첫 벽 칸 바로 앞)에 맞춤. 벽을 따라가는 위치(가로)는 측정값 그대로.
#   그림1   x -2.51~-2.56, y 1.02~1.45
#   그림2   x -2.52(~3.51은 지도 밖이라 버림), y 2.5~4.01
#   그림3   x -1.51~-1.02, y 5.14~5.15
#   그림4   x 0.43~0.06,   y 3.96~3.51
#   출구    x 0.2~0.17,    y 1.11~0.56
#   키오스크 x -0.84~-1.38, y 0.29~-0.301

# 작품: 관람객이 구역 안에서 멈추면 (artwork_zone 노드의 dwell_time·dwell_radius)
#       explain_artwork 액션으로 설명 재생. artwork_id는 arti_audio 작품 정보(artworks_sample.yaml)의 키.
artworks:
  - {artwork_id: art_01, name: 그림1, x: -2.72, y: 1.23, facing_deg: 0,   radius: 0.7}   # 왼쪽 벽
  - {artwork_id: art_02, name: 그림2, x: -2.72, y: 3.25, facing_deg: 0,   radius: 0.7}   # 왼쪽 벽
  - {artwork_id: art_03, name: 그림3, x: -1.27, y: 5.25, facing_deg: -90, radius: 0.7}   # 위쪽 벽
  - {artwork_id: art_04, name: 그림4, x: 0.12,  y: 3.73, facing_deg: 180, radius: 0.7}   # 오른쪽 벽

# 안내 구역: 관람객이 들어가면 (멈추지 않아도) guide_message로 안내 음성.
#            guide는 arti_audio guide_lines.yaml의 guides 키.
guide_zones:
  # 출구(종료 구역): 직사각형. 가로 = 가운데 벽 오른쪽 면(x -0.82) ~ 오른쪽 바깥벽 안쪽 면(x 0.13),
  #   세로 = 출구 측정 범위 y 0.56~1.11을 그림4 쪽으로 0.8 m 올림 (maps/gallery.pgm 기준, 2026-11-17)
  - {zone_id: exit,  name: 출구,     shape: rect, x_min: -0.82, x_max: 0.13, y_min: 1.36, y_max: 1.91, guide: tour_end}
  - {zone_id: kiosk, name: 키오스크, x: -1.11, y: -0.39, facing_deg: 90,  radius: 0.7, guide: kiosk}      # 아래쪽 벽
